AWSTemplateFormatVersion: '2010-09-09'
Resources:
  PaymentFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PaymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ISSUE: Wildcard permissions
              - Effect: Allow
                Action: '*'
                Resource: '*'
